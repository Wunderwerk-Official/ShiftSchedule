name: Agent arena (truhn.ai)

# Benchmark the agent solver against the complex-practice fixture, ON the
# production LXC (the only place that reaches the self-hosted LLM endpoint
# and holds the saved Anthropic key). Runs an isolated experiment process
# using the deployed harness and fixture. The selected prompt variant,
# provider and model never change production files or saved settings.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day to solve (ISO)"
        default: "2026-02-02"
      days:
        description: "Number of days (max 7)"
        default: "1"
      timeout:
        description: "Wall-clock budget in seconds (max 18000); 0 = unlimited like production (aborted at 330 min)"
        default: "600"
      provider:
        description: "LLM provider for this run (saved settings stay unchanged)"
        type: choice
        options: [configured, openai, anthropic]
        default: configured
      model:
        description: "Model ID; empty = the model saved for that provider (e.g. claude-opus-5-5, claude-sonnet-5-5)"
        default: ""
      variant:
        description: "Prompt experiment"
        type: choice
        options: [baseline, focused]
        default: baseline
      scenario:
        description: "base | vacation-wave | understaffed | crunch | oncall | pinned | daynight | fixed-patterns"
        default: "base"
      strategy:
        description: "day_by_day (standard) | repair (benchmark reference)"
        default: "day_by_day"
      reasoning:
        description: "effort: (empty) | low | medium | high — Claude also xhigh | max; empty = model default (Opus 5.5: medium)"
        default: ""
      implementation:
        description: "Code/profile to test; checkout runs only in a temporary directory"
        type: choice
        options: [deployed, checkout, checkout-balanced, checkout-neighborhood, checkout-balanced-neighborhood]
        default: deployed

jobs:
  arena:
    runs-on: ubuntu-latest
    # A Claude week run without a wall-clock budget can take hours. The run
    # aborts itself at 330 minutes (prompt_eval HARD_LIMIT_SECONDS) and the
    # container stops it at 340, so it never outlives this job.
    timeout-minutes: 350
    concurrency:
      # One running run per provider; Claude runs do not wait for GPU runs.
      # GitHub keeps at most one waiting run per group and a newer dispatch
      # replaces it: dispatch the next run once the previous one started.
      group: agent-arena-${{ inputs.provider == 'anthropic' && 'anthropic' || 'self-hosted-gpu' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH (bastion jump)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SSH_KEY_FUER_SHIFTSCHEDULE_SERVER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_truhn
          chmod 600 ~/.ssh/id_truhn
          cat > ~/.ssh/config <<'CFG'
          Host truhn-bastion
            HostName 49.13.89.75
            Port 4444
            User dtruhn
            IdentityFile ~/.ssh/id_truhn
            StrictHostKeyChecking accept-new
            BatchMode yes
            ServerAliveInterval 30
            ServerAliveCountMax 120

          Host truhn-target
            HostName 10.10.10.6
            User root
            IdentityFile ~/.ssh/id_truhn
            ProxyJump truhn-bastion
            StrictHostKeyChecking accept-new
            BatchMode yes
          CFG
          chmod 600 ~/.ssh/config

      - name: Run the arena case on the LXC
        env:
          START: ${{ inputs.start }}
          DAYS: ${{ inputs.days }}
          TIMEOUT: ${{ inputs.timeout }}
          MODEL: ${{ inputs.model }}
          PROVIDER: ${{ inputs.provider }}
          SCENARIO: ${{ inputs.scenario }}
          STRATEGY: ${{ inputs.strategy }}
          REASONING: ${{ inputs.reasoning }}
          VARIANT: ${{ inputs.variant }}
          IMPLEMENTATION: ${{ inputs.implementation }}
        run: |
          set -euo pipefail
          python3 -m backend.arena.build_job
          ssh truhn-target 'cd /opt/app && docker compose -f docker-compose.proxied.yml exec -T backend timeout --kill-after=60 20400 python -' \
            < arena_job.py | tee arena-trace.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-evaluation-${{ github.run_id }}
          path: arena-trace.log
          retention-days: 14
